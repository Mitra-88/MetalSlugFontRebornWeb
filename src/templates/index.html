<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>MetalSlugFontReborn</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="icon" href="/static/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/static/manifest.json" />
    <script src="/static/js/fonts.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d17" />
    <meta name="description" content="A tool for creating images with the Metal Slug font.">
    <meta name="keywords" content="Metal Slug, Metal Slug Font, Metal Slug Font Reborn">
    <meta name="author" content="Mitra88, AmbitiousFlowDev">
    <meta property="og:title" content="MetalSlugFontReborn">
    <meta property="og:description" content="A tool for creating images with the Metal Slug font.">
    <meta property="og:image" content="/static/assets/icons/logo.png">
    <meta property="og:url" content="https://vermeil.pythonanywhere.com/">
</head>
<body>
    <div class="github-link">
        <a href="https://github.com/Mitra-88/MetalSlugFontRebornWeb" target="_blank" rel="noopener noreferrer">
            <img src="/static/assets/icons/github.svg" alt="GitHub" />
            Source
        </a>
    </div>

    <div class="page">
        <img class="mascot" src="/static/assets/icons/Raubtier.webp" alt="Raubtier mascot" />
        <h1 class="title">Metal<span>Slug</span>FontReborn</h1>

        <div class="card">
            <form id="form" novalidate>
                <div>
                    <label class="field-label" for="text-input">Mission text</label>
                    <textarea id="text-input" name="text" placeholder="Enter text here" required></textarea>
                    <div class="field-meta">
                        <span class="custom-error-msg">Mission text cannot be empty!</span>
                        <span class="char-count" id="char-count">0 chars</span>
                    </div>
                </div>

                <div class="field-row">
                    <div>
                        <label class="field-label" for="font">Font variant</label>
                        <select id="font" name="font">
                            <option value="1">Font 1</option>
                            <option value="2">Font 2</option>
                            <option value="3">Font 3</option>
                            <option value="4">Font 4</option>
                            <option value="5">Font 5</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label" for="color">Color</label>
                        <select id="color" name="color">
                            <option value="blue">Blue</option>
                            <option value="orange">Orange</option>
                            <option value="gold">Gold</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div>
                        <label class="field-label" for="scale">Output scale</label>
                        <select id="scale" name="scale">
                            <option value="1" selected>1× (Native)</option>
                            <option value="2">2×</option>
                            <option value="3">3×</option>
                            <option value="4">4×</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label" for="compress">
                            Compression: <output id="compress-val">6</output>
                        </label>
                        <input type="range" id="compress" name="compress" min="0" max="9" value="6" step="1">
                        <div class="range-labels"><span>0 (fast)</span><span>9 (small)</span></div>
                    </div>
                </div>

                <input type="submit" value="Generate Image" id="generate-btn" />
            </form>

            <section class="output-section">
                <div class="divider" id="divider" style="display:none;"></div>
                <p class="error-msg" id="error-msg" style="display:none;"></p>
                <div class="img-meta" id="img-meta" style="display:none;"></div>
                <img class="output-img" id="result-img" style="display:none;" alt="Generated Metal Slug text" />
                <button class="download-btn" id="download-link" style="display:none;">Download Image</button>
            </section>
        </div>

        <section class="footer-links">
            <p>
                <a href="/supported">Supported characters</a>
                <span class="dot">·</span>
                <a href="/examples">Browse examples</a>
            </p>
        </section>
    </div>

    <script>
    (() => {
        "use strict";

        const $ = id => document.getElementById(id);
        const form = $("form");
        const textInput = $("text-input");
        const generateBtn = $("generate-btn");
        const resultImg = $("result-img");
        const errorMsg = $("error-msg");
        const divider = $("divider");
        const downloadLink = $("download-link");
        const charCount = $("char-count");
        const imgMeta = $("img-meta");
        const compressSlider = $("compress");
        const compressVal = $("compress-val");

        let abortCtrl = null;
        let debounceId = 0;
        let lastBlobUrl = null;

        // --- Helpers ---
        function show(el) { el.style.display = ""; }
        function hide(el) { el.style.display = "none"; }

        function showError(msg, unsupported) {
            errorMsg.innerHTML = msg + (unsupported ? ' <a href="/supported">See supported characters.</a>' : "");
            show(errorMsg); show(divider);
            hide(resultImg); hide(downloadLink); hide(imgMeta);
        }

        function clearOutput() {
            hide(errorMsg); hide(resultImg); hide(downloadLink); hide(imgMeta); hide(divider);
        }

        function revokeLast() {
            if (lastBlobUrl) { URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; }
        }

        function buildFormData() {
            const fd = new FormData();
            fd.set("text", textInput.value);
            fd.set("font", $("font").value);
            fd.set("color", $("color").value);
            fd.set("scale", $("scale").value);
            fd.set("compress", compressSlider.value);
            return fd;
        }

        // --- Generate ---
        async function generate() {
            const text = textInput.value;
            if (!text.trim()) return;

            // Cancel in-flight request
            if (abortCtrl) abortCtrl.abort();
            abortCtrl = new AbortController();

            generateBtn.value = "Generating…";
            generateBtn.disabled = true;
            clearOutput();

            try {
                const res = await fetch("/api/generate", {
                    method: "POST",
                    body: buildFormData(),
                    signal: abortCtrl.signal,
                });

                if (res.ok) {
                    const blob = await res.blob();
                    revokeLast();
                    lastBlobUrl = URL.createObjectURL(blob);

                    const w = res.headers.get("X-Image-Width") || "?";
                    const h = res.headers.get("X-Image-Height") || "?";

                    resultImg.src = lastBlobUrl;
                    imgMeta.textContent = `${w} × ${h} px`;
                    show(resultImg); show(downloadLink); show(imgMeta); show(divider);
                } else {
                    const data = await res.json().catch(() => ({}));
                    showError(data.error || "Unknown error.", data.unsupported);
                }
            } catch (e) {
                if (e.name === "AbortError") return; // superseded
                showError("Network error. Please try again.");
            } finally {
                generateBtn.value = "Generate Image";
                generateBtn.disabled = false;
            }
        }

        // --- Download ---
        async function download(e) {
            e.preventDefault();
            if (!textInput.value.trim()) return;

            downloadLink.textContent = "Preparing…";
            downloadLink.style.opacity = "0.6";

            try {
                const res = await fetch("/api/download", { method: "POST", body: buildFormData() });
                if (!res.ok) throw new Error();
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "metal-slug-mission.png";
                a.click();
                URL.revokeObjectURL(url);
            } catch {
                showError("Download failed. Try again.");
            } finally {
                downloadLink.textContent = "Download Image";
                downloadLink.style.opacity = "1";
            }
        }

        // --- Events ---
        generateBtn.addEventListener("click", generate);
        downloadLink.addEventListener("click", download);

        // Live char count
        textInput.addEventListener("input", () => {
            charCount.textContent = `${textInput.value.length} chars`;
            clearTimeout(debounceId);
            debounceId = setTimeout(generate, 350);
        });

        // Regenerate on control change
        for (const id of ["font", "color", "scale"]) {
            $(id).addEventListener("change", generate);
        }

        compressSlider.addEventListener("input", () => {
            compressVal.textContent = compressSlider.value;
        });
        compressSlider.addEventListener("change", generate);

        // Prevent native form submit
        form.addEventListener("submit", e => e.preventDefault());
    })();
    </script>
</body>
</html>
