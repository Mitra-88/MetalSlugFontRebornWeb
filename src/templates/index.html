<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>MetalSlugFontReborn</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="icon" href="/static/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/static/manifest.json" />
    <script src="/static/js/fonts.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d17" />
    <meta name="description" content="A tool for creating images with the Metal Slug font.">
    <meta name="keywords" content="Metal Slug, Metal Slug Font, Metal Slug Font Reborn">
    <meta name="author" content="Mitra88, AmbitiousFlowDev">
    <meta property="og:title" content="MetalSlugFontReborn">
    <meta property="og:description" content="A tool for creating images with the Metal Slug font.">
    <meta property="og:image" content="/static/assets/icons/logo.png">
    <meta property="og:url" content="https://vermeil.pythonanywhere.com/">
</head>
<body>
    <div class="github-link">
        <a href="https://github.com/Mitra-88/MetalSlugFontRebornWeb" target="_blank" rel="noopener noreferrer">
            <img src="/static/assets/icons/github.svg" alt="GitHub" />
            Source
        </a>
    </div>

    <div class="page">
        <img class="mascot" src="/static/assets/icons/Raubtier.webp" alt="Raubtier mascot" />

        <h1 class="title">Metal<span>Slug</span>FontReborn</h1>

        <div class="card">
            <form id="form" action="/api/generate" method="post" novalidate onsubmit="return false;">
                <div>
                    <label class="field-label" for="text-input">Mission text</label>
                    <textarea id="text-input" name="text" placeholder="Enter text here" required></textarea>
                    <span class="custom-error-msg">Mission text cannot be empty!</span>
                </div>

                <div class="field-row">
                    <div>
                        <label class="field-label" for="font">Font variant</label>
                        <select id="font" name="font">
                            <option value="1">Font 1</option>
                            <option value="2">Font 2</option>
                            <option value="3">Font 3</option>
                            <option value="4">Font 4</option>
                            <option value="5">Font 5</option>
                        </select>
                    </div>

                    <div>
                        <label class="field-label" for="color">Color</label>
                        <select id="color" name="color">
                            <option value="blue">Blue</option>
                            <option value="orange">Orange</option>
                            <option value="gold">Gold</option>
                        </select>
                    </div>
                </div>

                <input type="submit" value="Generate Image" id="generate-btn" />
            </form>

            <section class="output-section">
                <div class="divider" id="divider" style="display:none;"></div>
                <p class="error-msg" id="error-msg" style="display:none;"></p>
                <img class="output-img" id="result-img" style="display:none;" alt="Generated Metal Slug text" />
                <button class="download-btn" id="download-link" style="display:none;">Download Image</button>
            </section>
        </div>

        <section class="footer-links" id="supported">
            <p>
                <a href="/supported">Supported characters</a>
                <span class="dot">·</span>
                <a href="/examples">Browse examples</a>
            </p>
        </section>
    </div>

    <script>
        const form = document.getElementById('form');
        const generateBtn = document.getElementById('generate-btn');
        const resultImg = document.getElementById('result-img');
        const errorMsg = document.getElementById('error-msg');
        const divider = document.getElementById('divider');
        const downloadLink = document.getElementById('download-link');

        async function generateImage() {
            const formData = new FormData(form);
            if (!formData.get('text').trim()) return;
            
            generateBtn.value = "Generating...";
            generateBtn.disabled = true;
            errorMsg.style.display = 'none';
            resultImg.style.display = 'none';
            downloadLink.style.display = 'none';

            try {
                const response = await fetch('/api/generate', { method: 'POST', body: formData });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    resultImg.src = url;
                    resultImg.style.display = 'block';
                    downloadLink.style.display = 'block';
                    divider.style.display = 'block';
                } else {
                    const errData = await response.json();
                    errorMsg.innerHTML = errData.error + (errData.unsupported ? ' <a href="/supported">See supported characters.</a>' : '');
                    errorMsg.style.display = 'block';
                    divider.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = "Network error. Please try again.";
                errorMsg.style.display = 'block';
                divider.style.display = 'block';
            } finally {
                generateBtn.value = "Generate Image";
                generateBtn.disabled = false;
            }
        }

        generateBtn.addEventListener('click', generateImage);

        async function downloadImage(e) {
            e.preventDefault();
            const formData = new FormData(form);
            if (!formData.get('text').trim()) return;

            downloadLink.innerText = "Preparing...";
            downloadLink.style.opacity = "0.6";

            try {
                const response = await fetch('/api/download', { method: 'POST', body: formData });
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'metal-slug-mission.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } else {
                    alert("Failed to generate download.");
                }
            } catch (err) {
                alert("Network error.");
            } finally {
                downloadLink.innerText = "Download Image";
                downloadLink.style.opacity = "1";
            }
        }

        downloadLink.addEventListener('click', downloadImage);

        let debounceTimer;
        document.getElementById('text-input').addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(generateImage, 300);
        });
        document.getElementById('color').addEventListener('change', generateImage);
    </script>
</body>
</html>
