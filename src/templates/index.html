<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalSlugFontReborn</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="icon" href="/static/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/static/manifest.json">
    <script src="/static/js/fonts.js" defer></script>
    <meta name="theme-color" content="#090d17">
    <meta name="description" content="A tool for creating images with the Metal Slug font.">
    <meta name="keywords" content="Metal Slug, Metal Slug Font, Metal Slug Font Reborn">
    <meta name="author" content="Mitra88, AmbitiousFlowDev">
    <meta property="og:title" content="MetalSlugFontReborn">
    <meta property="og:description" content="A tool for creating images with the Metal Slug font.">
    <meta property="og:image" content="/static/assets/icons/logo.png">
    <meta property="og:url" content="https://vermeil.pythonanywhere.com/">
</head>
<body>
    <div class="github-link">
        <a href="https://github.com/Mitra-88/MetalSlugFontRebornWeb" target="_blank" rel="noopener noreferrer">
            <img src="/static/assets/icons/github.svg" alt="GitHub">
            Source
        </a>
    </div>

    <div class="page">
        <img class="mascot" src="/static/assets/icons/Raubtier.webp" alt="Raubtier mascot">
        <h1 class="title">Metal<span>Slug</span>FontReborn</h1>

        <div class="card">
            <form id="form" novalidate>
                <div>
                    <label class="field-label" for="text-input">Text</label>
                    <textarea id="text-input" name="text" placeholder="Enter text here" required></textarea>
                    <div class="field-meta">
                        <span class="custom-error-msg" id="validation-msg">text cannot be empty!</span>
                        <span class="char-count" id="char-count">0 characters</span>
                    </div>
                </div>

                <div class="field-row">
                    <div>
                        <label class="field-label" for="font">Font variant</label>
                        <select id="font" name="font">
                            <option value="1">Font 1</option>
                            <option value="2">Font 2</option>
                            <option value="3">Font 3</option>
                            <option value="4">Font 4</option>
                            <option value="5">Font 5</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label" for="color">Color</label>
                        <select id="color" name="color">
                            <option value="blue">Blue</option>
                            <option value="orange">Orange</option>
                            <option value="gold">Gold</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div>
                        <label class="field-label" for="scale">Output scale</label>
                        <select id="scale" name="scale">
                            <option value="1" selected>1× (Native)</option>
                            <option value="2">2×</option>
                            <option value="3">3×</option>
                            <option value="4">4×</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label" for="compress">
                            Compression: <output id="compress-val">6</output>
                        </label>
                        <input type="range" id="compress" name="compress" min="0" max="9" value="6" step="1">
                        <div class="range-labels"><span>0 (fastest ⚡)</span><span>9 (smallest 📦)</span></div>
                    </div>
                </div>
            </form>

            <section class="output-section" id="output-section" data-state="idle">
                <div class="output-divider"></div>

                <div class="output-stage">
                    <div class="output-placeholder">
                        <svg class="placeholder-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                        <span class="placeholder-title placeholder-idle">Nothing to preview</span>
                        <span class="placeholder-title placeholder-loading">Rendering<span class="d">.</span><span class="d">.</span><span class="d">.</span></span>
                        <span class="placeholder-hint">Type text above - the image renders live</span>
                    </div>

                    <div class="output-result">
                        <p class="img-meta" id="img-meta"></p>
                        <div class="img-frame">
                            <img class="output-img" id="result-img" alt="Generated Metal Slug text">
                        </div>
                        <button class="download-btn" id="download-link" type="button">Download Image</button>
                    </div>

                    <p class="error-msg" id="error-msg" role="alert"></p>
                </div>
            </section>
        </div>

        <section class="footer-links">
            <p>
                <a href="/supported">Supported characters</a>
                <span class="dot">·</span>
                <a href="/examples">Browse examples</a>
            </p>
        </section>
    </div>

    <script>
    (() => {
        "use strict";

        const $ = id => document.getElementById(id);
        const form = $("form");
        const textInput = $("text-input");
        const output = $("output-section");
        const resultImg = $("result-img");
        const errorMsg = $("error-msg");
        const imgMeta = $("img-meta");
        const downloadBtn = $("download-link");
        const charCount = $("char-count");
        const compress = $("compress");
        const compressVal = $("compress-val");

        let abortCtrl = null;
        let debounceId = 0;
        let blobUrl = null;

        const setState = s => { output.dataset.state = s; };

        const buildFD = preview => {
            const fd = new FormData();
            fd.set("text", textInput.value);
            fd.set("font", $("font").value);
            fd.set("color", $("color").value);
            fd.set("scale", $("scale").value);
            fd.set("compress", preview ? "1" : compress.value);
            return fd;
        };

        const revokeBlob = () => {
            if (blobUrl) {
                URL.revokeObjectURL(blobUrl);
                blobUrl = null;
            }
        };

        async function generate() {
            if (!textInput.value.trim()) return;

            const current = new AbortController();
            if (abortCtrl) abortCtrl.abort();
            abortCtrl = current;

            setState("loading");

            try {
                const res = await fetch("/api/generate", {
                    method: "POST",
                    body: buildFD(true),
                    signal: current.signal,
                });

                if (res.ok) {
                    revokeBlob();
                    blobUrl = URL.createObjectURL(await res.blob());
                    resultImg.src = blobUrl;
                    imgMeta.textContent = `${res.headers.get("X-Image-Width") || "?"} × ${res.headers.get("X-Image-Height") || "?"} px`;
                    setState("success");
                } else {
                    const d = await res.json().catch(() => ({}));
                    errorMsg.innerHTML = (d.error || "Unknown error.") + (d.unsupported ? ' <a href="/supported">See supported characters.</a>' : "");
                    setState("error");
                }
            } catch (e) {
                if (e.name === "AbortError") return;
                errorMsg.textContent = "Network error. Please try again.";
                setState("error");
            }
        }

        async function download() {
            if (!textInput.value.trim()) return;

            downloadBtn.textContent = "Preparing…";
            downloadBtn.disabled = true;

            try {
                const res = await fetch("/api/download", { method: "POST", body: buildFD(false) });
                if (!res.ok) throw new Error("Download failed");
                
                const url = URL.createObjectURL(await res.blob());
                const a = Object.assign(document.createElement("a"), {
                    href: url,
                    download: "metal-slug-generated.png"
                });
                a.click();
                URL.revokeObjectURL(url);
            } catch {
                errorMsg.textContent = "Download failed. Try again.";
                setState("error");
            } finally {
                downloadBtn.textContent = "Download Image";
                downloadBtn.disabled = false;
            }
        }

        form.addEventListener("submit", e => e.preventDefault());
        downloadBtn.addEventListener("click", download);

        textInput.addEventListener("input", () => {
            charCount.textContent = `${textInput.value.length} characters`;
            clearTimeout(debounceId);
            if (!textInput.value.trim()) {
                setState("idle");
                revokeBlob();
                return;
            }
            debounceId = setTimeout(generate, 350);
        });

        for (const id of ["font", "color", "scale"]) {
            $(id).addEventListener("change", generate);
        }

        compress.addEventListener("input", () => { compressVal.textContent = compress.value; });
        compress.addEventListener("change", generate);
    })();
    </script>
</body>
</html>
